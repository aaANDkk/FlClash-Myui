name: build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

env:
  IS_STABLE: ${{ !contains(github.ref, '-') }}
  BRANCH_CACHE: ${{ !startsWith(github.ref, 'refs/tags/') }}
  FLUTTER_VERSION: '3.50.0'
  GO_VERSION: '1.27.1'
  NDK_VERSION: r28c

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android
            os: ubuntu-latest
            arch: arm64
            target: apk
          - platform: windows
            os: Windows-2022
            arch: amd64
            target: exe

    steps:
      - name: Free disk space (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android/sdk/ndk
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo docker system prune --all --force --volumes 2>/dev/null || true
          df -h

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup Android Signing
        if: startsWith(matrix.platform,'android')
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE || secrets.FLCLASH || secrets.flclash }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || secrets.FLCLASH_KEY_ALIAS || 'flclash' }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || secrets.FLCLASH_STORE_PASSWORD || 'flclash123456' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || secrets.FLCLASH_KEY_PASSWORD || 'flclash123456' }}
        run: |
          python3 - << 'EOF'
          import base64, os, sys

          raw = "".join(os.environ.get("KEYSTORE_BASE64", "").split())
          if not raw:
              sys.exit(
                  "The KEYSTORE secret is empty. An APK signed with the per-machine "
                  "debug key changes certificate on every run and cannot be installed "
                  "over the existing app, so the build stops here."
              )
          raw += "=" * (-len(raw) % 4)
          data = base64.b64decode(raw, validate=True)
          os.makedirs("android/app", exist_ok=True)
          with open("android/app/keystore.jks", "wb") as f:
              f.write(data)
          with open("android/local.properties", "a", encoding="utf-8") as f:
              f.write(
                  f"\nkeyAlias={os.environ['KEY_ALIAS']}\n"
                  f"storePassword={os.environ['STORE_PASSWORD']}\n"
                  f"keyPassword={os.environ['KEY_PASSWORD']}\n"
              )
          print(f"Keystore written: {len(data)} bytes")
          EOF
          keytool -list -keystore android/app/keystore.jks -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS"
          keytool -list -v -keystore android/app/keystore.jks -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" | grep -E 'SHA256:'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: ${{ env.BRANCH_CACHE }}
          cache-dependency-path: core/go.sum

      - name: Setup Gradle
        if: startsWith(matrix.platform,'android')
        uses: gradle/actions/setup-gradle@v6

      - name: Enable git long paths (Windows)
        if: startsWith(matrix.os, 'windows')
        run: git config --global core.longpaths true

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ matrix.flutter-channel || 'stable' }}
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: ${{ env.BRANCH_CACHE }}

      - name: Setup NDK
        if: startsWith(matrix.platform,'android')
        uses: nttld/setup-ndk@v1
        id: build-ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: true
          link-to-sdk: true

      - name: Get Flutter Dependency
        run: |
          flutter --version
          flutter pub get
          flutter gen-l10n

      - name: Fetch CA certificates
        shell: bash
        env:
          CA_BUNDLE: cacert-2026-09-25.pem
          CA_BUNDLE_SHA256: a41b5d356aea97a529fe27e0f7316d2f9d946d75927476cf9cf1b90637d00505
        run: |
          bundle=core/Clash.Meta/component/ca/ca-certificates.crt
          curl -fsSL --ssl-no-revoke --retry 3 -o "$bundle" "https://curl.se/ca/$CA_BUNDLE"
          echo "$CA_BUNDLE_SHA256  $bundle" | sha256sum -c -

      - name: Apply Clash.Meta patches
        shell: bash
        run: |
          for patch in core/patches/*.patch; do
            [ -f "$patch" ] || continue
            echo "Applying $patch"
            git -C core/Clash.Meta apply --ignore-whitespace --check "../../$patch"
            git -C core/Clash.Meta apply --ignore-whitespace "../../$patch"
          done

      - name: Setup
        env:
          ANDROID_NDK_HOME: ${{ steps.build-ndk.outputs.ndk-path }}
        run: dart tool/package.dart ${{ matrix.platform }} ${{ env.IS_STABLE == 'true' && '--env stable' || '' }} --arch ${{ matrix.arch }} --targets ${{ matrix.target }} -v

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: artifact-${{ matrix.platform }}${{ matrix.arch && format('-{0}', matrix.arch) }}
          path: ./dist/*.${{ matrix.target }}
          if-no-files-found: error
          overwrite: true

      - name: Verify Android signature
        if: startsWith(matrix.platform,'android')
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || secrets.FLCLASH_KEY_ALIAS || 'flclash' }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || secrets.FLCLASH_STORE_PASSWORD || 'flclash123456' }}
        run: |
          for apk in dist/*.apk; do
            [ -e "$apk" ] || continue
            apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -n 1)
            expected=$(keytool -list -v -keystore android/app/keystore.jks -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" | sed -n 's/.*SHA256: *//p' | tr -d ':' | tr 'A-F' 'a-f')
            actual=$("$apksigner" verify --print-certs "$apk" | sed -n 's/.*SHA-256 digest: *//p' | head -n 1 | tr -d ':' | tr 'A-F' 'a-f')
            echo "keystore: $expected"
            echo "apk:      $actual ($apk)"
            if [ -z "$expected" ] || [ -z "$actual" ]; then
              echo "::warning::Could not compare the two certificates; check $apk by hand."
            elif [ "$expected" != "$actual" ]; then
              echo "::error::$apk is not signed with the release keystore."
              exit 1
            fi
          done

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    needs: [ build ]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download
        uses: actions/download-artifact@v4
        with:
          path: ./dist/
          pattern: artifact-*
          merge-multiple: true

      - name: Generate release notes
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          build_version=$(sed -n 's/^version: *\([^+ ]*\).*/\1/p' pubspec.yaml | head -n 1)
          sed "s|BUILD_VERSION|$build_version|g; s|VERSION|$version|g" .github/release_template.md > release.md

      - name: Generate sha256
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          previous="$RUNNER_TEMP/previous-release-SHA256SUMS"
          cd ./dist
          shopt -s nullglob
          apks=(*-android-arm64.apk)
          exes=(*-windows-amd64-setup.exe)
          test "${#apks[@]}" = 1
          test "${#exes[@]}" = 1
          sha256sum "${apks[0]}" "${exes[0]}" > SHA256SUMS
          if gh release download "$TAG" --pattern SHA256SUMS --output "$previous"; then
            awk '
              NF == 2 {
                name = $2
                sub(/^\*/, "", name)
                sub(/^\.\//, "", name)
                if (NR == FNR) { current[name] = 1; next }
                if (!(name in current)) print $1 "  " name
              }
            ' SHA256SUMS "$previous" >> SHA256SUMS
          fi

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./dist/*
          body_path: './release.md'
          prerelease: ${{ env.IS_STABLE != 'true' }}
